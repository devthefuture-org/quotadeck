server:
  bind: 127.0.0.1
  port: 9211

storage:
  database: ~/.local/share/quotadeck/quotadeck.db
  retentionDays: 30

polling:
  interval: 60s
  timeout: 20s

providers:
  claude:
    enabled: true
    binary: cswap

  zai:
    enabled: true
    requestTimeout: 15s
    maxRetries: 3
    # The packaged service reads these variables from
    # ~/.config/quotadeck/environment when that file exists.
    accounts:
      - label: personal
        keyEnv: ZAI_API_KEY_PERSONAL
        region: global
      - label: team
        keyEnv: ZAI_API_KEY_TEAM
        region: global
        organizationIdEnv: ZAI_ORG_ID_TEAM
        workspaceIdEnv: ZAI_WORKSPACE_ID_TEAM

  codex:
    enabled: true
    binary: codex
    accounts:
      - label: personal
        home: ~/.codex
      - label: work
        home: ~/.codex-work

  kimi:
    enabled: true
    requestTimeout: 15s
    maxRetries: 3
    # Discovered automatically: KIMI_API_KEY / KIMI_CODING_API_KEY environment
    # variables, a Kimi base URL in ~/.claude/settings.json, and Kimi Code CLI
    # credential files under ~/.kimi-code/credentials. Explicit accounts below
    # are optional and win deduplication.
    # accounts:
    #   - label: personal
    #     keyEnv: KIMI_API_KEY_PERSONAL
    # homePaths:
    #   - ~/.kimi-code
