server:
  bind: 127.0.0.1
  port: 19211

storage:
  database: /tmp/quotadeck-smoke.db
  retentionDays: 1

polling:
  interval: 1h
  timeout: 12s

providers:
  claude:
    enabled: true
    binary: cswap
  zai:
    enabled: false
  codex:
    enabled: true
    binary: codex
    accounts:
      - label: smoke
        home: ~/.codex
